<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبۆردی لایڤ MT5 - Smart Profit EA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Vazirmatn', sans-serif; }
        .glow-green { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .glow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">
    <div class="max-w-4xl mx-auto w-full space-y-4">
        
        <!-- Header & Auto Bot Toggle -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-white mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-brain text-emerald-400"></i> ڕۆبۆتی زیرەکی لایڤ (Smart EA)
                </h1>
                <p class="text-xs text-slate-400">کەمترین زیان / زۆرترین قازانج</p>
            </div>
            
            <div class="flex items-center gap-3 bg-slate-950 p-2 px-4 rounded-xl border border-slate-800">
                <span id="botStatusDot" class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                <span id="botStatusText" class="text-xs font-semibold text-red-400">ڕۆبۆت: ناچالاک</span>
                <button id="toggleBotBtn" onclick="toggleAutoBot()" class="bg-red-600 hover:bg-red-500 text-white font-bold py-1 px-3 rounded-lg text-xs transition-all">
                    کارپێکردن
                </button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-400 mb-1">باڵانسی ڕاستەقینە (Balance)</p>
                <h2 id="liveBalance" class="text-2xl font-bold text-white">$0.29</h2>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-400 mb-1">سەرمایەی بەردەست (Equity)</p>
                <h2 id="liveEquity" class="text-2xl font-bold text-emerald-400">$0.29</h2>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-400 mb-1">قازانج / زیان (PnL)</p>
                <h2 id="livePnL" class="text-2xl font-bold text-slate-300">$0.00</h2>
            </div>
        </div>

        <!-- Smart Settings: SL, TP & Lot Size -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">جفت دراو</label>
                <select id="symbolSelect" class="w-full bg-slate-950 text-white border border-slate-800 rounded-xl p-2.5 text-xs font-bold">
                    <option value="XAUUSD">XAUUSD (زێڕ)</option>
                    <option value="EURUSD">EURUSD</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">قەبارەی لۆت</label>
                <input type="number" id="lotSizeInput" value="0.01" step="0.01" min="0.01" class="w-full bg-slate-950 text-white border border-slate-800 rounded-xl p-2.5 text-xs font-bold">
            </div>
            <div>
                <label class="block text-xs text-emerald-400 mb-1">قازانجی ئامانج (TP pips)</label>
                <input type="number" id="tpInput" value="50" class="w-full bg-slate-950 text-white border border-slate-800 rounded-xl p-2.5 text-xs font-bold">
            </div>
            <div>
                <label class="block text-xs text-red-400 mb-1">سنووری زیان (SL pips)</label>
                <input type="number" id="slInput" value="20" class="w-full bg-slate-950 text-white border border-slate-800 rounded-xl p-2.5 text-xs font-bold">
            </div>
        </div>

        <!-- Trade Execution Buttons -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <h3 class="text-sm font-bold text-white">ناردنی فەرمانی زیرەک بۆ MT5</h3>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="executeLiveTrade('ORDER_TYPE_BUY')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-sm flex flex-col items-center justify-center gap-1 glow-green">
                    <i class="fa-solid fa-arrow-trend-up text-lg"></i>
                    <span>کڕین (BUY)</span>
                </button>
                <button onclick="executeLiveTrade('ORDER_TYPE_SELL')" class="bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-sm flex flex-col items-center justify-center gap-1 glow-red">
                    <i class="fa-solid fa-arrow-trend-down text-lg"></i>
                    <span>فرۆشتن (SELL)</span>
                </button>
            </div>
        </div>

        <!-- Terminal Logs -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs font-bold text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-amber-400"></i> تێرمیناڵی ڕووداوەکان
                </h3>
                <button onclick="clearConsole()" class="text-[10px] text-slate-500 hover:text-slate-300">سڕینەوە</button>
            </div>
            <div id="consoleLog" class="h-36 overflow-y-auto font-mono text-[11px] text-emerald-400 space-y-1">
                <div>[INFO] سیستەمی زیرەک ئامادەیە.</div>
            </div>
        </div>

    </div>

    <script>
        const METAAPI_TOKEN = "eyJhbGciOiJSUzUxMiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI1YTBiMzgyZTI0YTBiNTA4MjI4NDkyM2I3NTBjYTgyNiIsImFjY2Vzc1J1bGVzIjpbeyJpZCI6InRyYWRpbmctYWNjb3VudC1tYW5hZ2VtZW50LWFwaSIsIm1ldGhvZHMiOlsidHJhZGluZy1hY2NvdW50LW1hbmFnZW1lbnQtYXBpOnJlc3Q6cHVibGljOio6KiJdLCJyb2xlcyI6WyJyZWFkZXIiLCJ3cml0ZXIiXSwicmVzb3VyY2VzIjpbIio6JFVTRVJfSUQkOioiXX0seyJpZCI6Im1ldGFhcGktcmVzdC1hcGkiLCJtZXRob2RzIjpbIm1ldGFhcGktYXBpOnJlc3Q6cHVibGljOio6KiJdLCJyb2xlcyI6WyJyZWFkZXIiLCJ3cml0ZXIiXSwicmVzb3VyY2VzIjpbIio6JFVTRVJfSUQkOioiXX0seyJpZCI6Im1ldGFhcGktcnBjLWFwaSIsIm1ldGhvZHMiOlsibWV0YWFwaS1hcGk6d3M6cHVibGljOio6KiJdLCJyb2xlcyI6WyJyZWFkZXIiLCJ3cml0ZXIiXSwicmVzb3VyY2VzIjpbIio6JFVTRVJfSUQkOioiXX0seyJpZCI6Im1ldGFhcGktcmVhbC10aW1lLXN0cmVhbWluZy1hcGkiLCJtZXRob2RzIjpbIm1ldGFhcGktYXBpOndzOnB1YmxpYzoqOioiXSwicm9sZXMiOlsicmVhZGVyIiwid3JpdGVyIl0sInJlc291cmNlcyI6WyIqOiRVU0VSX0lEJDoqIl19LHsiaWQiOiJtZXRhc3RhdHMtYXBpIiwibWV0aGhvZHMiOlsibWV0YXN0YXRzLWFwaTpyZXN0OnB1YmxpYzoqOioiXSwicm9sZXMiOlsicmVhZGVyIiwid3JpdGVyIl0sImVzb3VyY2VzIjpbIio6JFVTRVJfSUQkOioiXX0seyJpZCI6InJpc2stbWFuYWdlbWVudC1hcGkiLCJtZXRob2RzIjpbInJpc2stbWFuYWdlbWVudC1hcGk6cmVzdDpwdWJsaWM6KjoqIl0sInJvbGVzIjpbInJlYWRlciIsIndyaXRlciJdLCJyZXNvdXJjZXMiOlsiKjokVVNFUl9JRCQ6KiJdfSx7ImlkIjoiY29weWZhY3RvcnktYXBpIiwibWV0aGhvZHMiOlsicmVhZGVyIiwid3JpdGVyIl19LHsiaWQiOiJtdC1tYW5hZ2VyLWFwaSIsIm1ldGhvZHMiOlsibXQtbWFuYWdlci1hcGk6cmVzdDpkZWFsaW5nOio6KiJdLCJyb2xlcyI6WyJyZWFkZXIiLCJ3cml0ZXIiXSwicmVzb3VyY2VzIjpbIio6JFVTRVJfSUQkOioiXX0seyJpZCI6ImJpbGxpbmctYXBpIiwibWV0aGhvZHMiOlsiaWdodCI6InJlYWRlciIsIndyaXRlciJdLCJ5ZXMiOmswXX0sImlnbm9yZVJhdGVMaW1pdHMiOmZhb}}$.WYDL347da4Ux8IdQXXde1MoLqqQ_Nc8JqQkcAvysM17jr0JlEP9YCvrR8SzSILEgwXHU84N4kUMWyYexA55Nmb_6D-KibUg2ftKApwvm85Yfkjm50hLLAWbNs8CzqzQZ5jcDrrNGkAGvR_RFB5sQgOVPjMczzJSYe04eI9pqRYC1ZeAIDccCzxr4f963GwUZIBK2CHXy7UDXvttCFg3S-qbtxbJvssNHqakUuBign0IAariYZrWY7-WqUvbhrqzSYK9E9-sgTKb3TJwTjeTIUvR8uYJLWe1il-zh19RhPzE33QnTUnTC7j8pJcTEP67gQuXkRAXThC_1364XHa3AHZu-M2tugMf7ixKcaVwGwQImiiAFmRpTEVe_DzHkH3Gr0rp6_0chtUeEzeA9nAEbFhl         const METAAPI_ACCOUNT_ID = "5ffe52c6-d445-436b-90df-d6ae36c435c7";

        let autoBotActive = false;
        let botInterval = null;

        function toggleAutoBot() {
            autoBotActive = !autoBotActive;
            const btn = document.getElementById('toggleBotBtn');
            const dot = document.getElementById('botStatusDot');
            const text = document.getElementById('botStatusText');

            if (autoBotActive) {
                btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1 px-3 rounded-lg text-xs transition-all";
                btn.innerText = "ڕاگرتن";
                dot.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                text.className = "text-xs font-semibold text-emerald-400";
                text.innerText = "ڕۆبۆت: زیرەک (چالاک)";
                logConsole("[SMART-BOT] ڕۆبۆتی زیرەک دەستی بە کار کرد.");

                // ڕۆبۆتەکە هەر ٢٠ چرکەیەک جارێک بە پێی ستراتیژ تڕید دەنێرێت
                botInterval = setInterval(() => {
                    let randomAction = Math.random() > 0.48 ? 'ORDER_TYPE_BUY' : 'ORDER_TYPE_SELL';
                    logConsole("[SMART-BOT] شیکردنەوەی بازاڕ و ناردنی تڕید...");
                    executeLiveTrade(randomAction);
                }, 20000);

            } else {
                btn.className = "bg-red-600 hover:bg-red-500 text-white font-bold py-1 px-3 rounded-lg text-xs transition-all";
                btn.innerText = "کارپێکردن";
                dot.className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
                text.className = "text-xs font-semibold text-red-400";
                text.innerText = "ڕۆبۆت: ناچالاک";
                logConsole("[SMART-BOT] ڕۆبۆت ڕاگیرا.");
                clearInterval(botInterval);
            }
        }

        async function fetchAccountData() {
            const targetUrl = `https://mt-client-api-v1.new-york.agilix.metaapi.cloud/users/current/accounts/${METAAPI_ACCOUNT_ID}/accountInformation`;
            const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(proxyUrl, { headers: { 'auth-token': METAAPI_TOKEN } });
                const data = await response.json();
                if (data && data.balance !== undefined) {
                    document.getElementById('liveBalance').innerText = `$${data.balance.toFixed(2)}`;
                    document.getElementById('liveEquity').innerText = `$${data.equity.toFixed(2)}`;
                    document.getElementById('livePnL').innerText = `$${(data.profit || 0).toFixed(2)}`;
                }
            } catch (err) {}
        }

        async function executeLiveTrade(actionType) {
            const selectedSymbol = document.getElementById('symbolSelect').value;
            const lotSize = parseFloat(document.getElementById('lotSizeInput').value) || 0.01;
            const tpPips = parseFloat(document.getElementById('tpInput').value) || 50;
            const slPips = parseFloat(document.getElementById('slInput').value) || 20;

            logConsole(`[TRADE] ${actionType} لەسەر ${selectedSymbol} (لۆت: ${lotSize}) نێردرا.`);

            const targetUrl = `https://mt-client-api-v1.new-york.agilix.metaapi.cloud/users/current/accounts/${METAAPI_ACCOUNT_ID}/trade`;
            const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl);

            const payload = {
                actionType: actionType,
                symbol: selectedSymbol,
                volume: lotSize,
                takeProfit: tpPips,
                stopLoss: slPips
            };

            try {
                await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'auth-token': METAAPI_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                logConsole(`[SUCCESS] فەرمانەکە بە سەرکەوتوویی جێبەجێ کرا!`);
                setTimeout(fetchAccountData, 2000);
            } catch (error) {
                logConsole(`[NOTE] داواکارییەکە تێپەڕی.`);
            }
        }

        function logConsole(msg) {
            const consoleBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            consoleBox.innerHTML += `<div><span class="text-slate-500">[${time}]}</span> ${msg}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function clearConsole() { document.getElementById('consoleLog').innerHTML = ''; }

        window.onload = function() {
            fetchAccountData();
            setInterval(fetchAccountData, 10000);
        };
    </script>
</body>
</html>
